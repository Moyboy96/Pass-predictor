<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pass Predictor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Passes">
<meta name="theme-color" content="#0E7C86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --surface-2: #F6F8FA;
    --text: #172029;
    --muted: #5B6873;
    --line: #D6DCE2;
    --accent: #0E7C86;
    --accent-ink: #FFFFFF;
    --accent-soft: #D9EEF0;
    --warn: #B4541A;
    --warn-soft: #F8E7DB;
    --ring: #C4CCD4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F161D;
      --surface: #16202A;
      --surface-2: #1B2631;
      --text: #E6ECF1;
      --muted: #8E9BA7;
      --line: #26323D;
      --accent: #3FC1C9;
      --accent-ink: #0B1519;
      --accent-soft: #143840;
      --warn: #E38B4C;
      --warn-soft: #3A281B;
      --ring: #34434F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F161D;
    --surface: #16202A;
    --surface-2: #1B2631;
    --text: #E6ECF1;
    --muted: #8E9BA7;
    --line: #26323D;
    --accent: #3FC1C9;
    --accent-ink: #0B1519;
    --accent-soft: #143840;
    --warn: #E38B4C;
    --warn-soft: #3A281B;
    --ring: #34434F;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    padding-bottom: env(safe-area-inset-bottom);
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }

  /* Header */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 12px;
  }
  .top h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .top .tz {
    font-size: 13px;
    color: var(--muted);
  }
  .top button.link {
    background: none; border: 0; padding: 0;
    color: var(--accent); font: inherit; font-size: 13px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* Hero */
  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
  }
  .hero .sat {
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 6px;
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  }
  .hero .sat .age { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
  .hero .sat .age.old { color: var(--warn); }
  .hero .lead { font-size: 14px; color: var(--muted); margin: 0; }
  .hero .big {
    font-size: 44px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 2px 0 6px;
  }
  .hero .big.live { color: var(--accent); }
  .hero .detail { font-size: 15px; margin: 0; }
  .hero .now {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    font-size: 13px;
  }
  .hero .now div span { display: block; color: var(--muted); font-size: 12px; }
  .hero .now div b { font-weight: 500; }
  .hero.empty .big { font-size: 22px; }

  /* Setup */
  details.setup {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 14px;
  }
  details.setup summary {
    cursor: pointer;
    list-style: none;
    padding: 14px 18px;
    font-weight: 500;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.setup summary::-webkit-details-marker { display: none; }
  details.setup summary .sum { color: var(--muted); font-weight: 400; font-size: 13px; text-align: right; }
  details.setup summary::after {
    content: ""; width: 8px; height: 8px; margin-left: 10px; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s;
  }
  details.setup[open] summary::after { transform: rotate(-135deg); }
  .setup-body { padding: 0 18px 18px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  textarea, input[type=number], input[type=text], select {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
  }
  textarea {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.4;
    min-height: 92px;
    resize: vertical;
    white-space: pre;
    overflow-x: auto;
  }
  textarea:focus, input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  button.primary {
    font: inherit; font-weight: 500; font-size: 15px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 9px; padding: 11px 18px; cursor: pointer;
  }
  button.ghost {
    font: inherit; font-size: 14px;
    background: transparent; color: var(--accent);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; cursor: pointer;
  }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted);
    margin-left: auto;
  }
  .toggle input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .msg { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .msg.err { color: var(--warn); }

  /* Pass list */
  .passes h2 {
    font-size: 13px; font-weight: 500; color: var(--muted);
    margin: 18px 0 8px 2px;
  }
  .pass {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr 64px;
    gap: 10px;
    align-items: center;
  }
  .pass.next { border-color: var(--accent); }
  .pass.live { background: var(--accent-soft); border-color: var(--accent); }
  .pass .times {
    font-size: 19px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2;
  }
  .pass .times .sep { color: var(--muted); font-weight: 400; margin: 0 4px; }
  .pass .peak { font-size: 14px; margin-top: 2px; }
  .pass .peak b { font-weight: 600; }
  .pass .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .pass svg { width: 64px; height: 64px; display: block; }
  .pass svg .ring { fill: none; stroke: var(--ring); stroke-width: 1; }
  .pass svg .cross { stroke: var(--ring); stroke-width: 1; }
  .pass svg .track { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pass svg .aos { fill: var(--accent); }
  .pass svg .n { font-size: 8px; fill: var(--muted); font-family: inherit; }
  .none { color: var(--muted); font-size: 14px; padding: 8px 2px; }

  @media (prefers-reduced-motion: reduce) {
    details.setup summary::after { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Pass predictor</h1>
    <span class="tz" id="tzLabel"></span>
  </div>

  <section class="hero empty" id="hero">
    <p class="sat"><span id="heroName">No satellite loaded</span><span class="age" id="heroAge"></span></p>
    <p class="lead" id="heroLead">Paste a TLE and set your location below.</p>
    <p class="big" id="heroBig"></p>
    <p class="detail" id="heroDetail"></p>
    <div class="now" id="heroNow" hidden>
      <div><span>Azimuth</span><b id="nowAz">–</b></div>
      <div><span>Elevation</span><b id="nowEl">–</b></div>
      <div><span>Range</span><b id="nowRange">–</b></div>
      <div><span>Sub-point</span><b id="nowSub">–</b></div>
    </div>
  </section>

  <details class="setup" id="setup" open>
    <summary><span>Satellite and location</span><span class="sum" id="setupSum"></span></summary>
    <div class="setup-body">
      <label class="field">
        <span>TLE (name line optional; several sets are fine)</span>
        <textarea id="tle" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="ISS (ZARYA)
1 25544U 98067A   26259.51782528  .00016717  00000-0  10270-3 0  9002
2 25544  51.6400 208.9163 0006703 130.5360 325.0288 15.49809224434567"></textarea>
      </label>
      <label class="field" id="satPickWrap" hidden>
        <span>Satellite</span>
        <select id="satPick"></select>
      </label>
      <div class="row">
        <label class="field"><span>Latitude °</span><input type="text" id="lat" autocomplete="off" placeholder="38.8977 or 38.8977N"></label>
        <label class="field"><span>Longitude °</span><input type="text" id="lon" autocomplete="off" placeholder="-77.0365 or 77.0365W"></label>
        <label class="field"><span>Altitude m</span><input type="text" id="alt" autocomplete="off" placeholder="0"></label>
      </div>
      <div class="row2">
        <label class="field"><span>Minimum elevation °</span><input type="number" id="minEl" step="1" min="0" max="89" inputmode="numeric" value="5"></label>
        <label class="field"><span>Look ahead, hours</span><input type="number" id="hours" step="1" min="1" max="336" inputmode="numeric" value="48"></label>
      </div>
      <div class="actions">
        <button class="primary" id="run">Compute passes</button>
        <button class="ghost" id="pick">Load TLE file</button>
        <input type="file" id="file" accept=".txt,.tle,.3le,.2le,text/plain" hidden>
        <button class="ghost" id="locate">Use my location</button>
        <label class="toggle"><input type="checkbox" id="utc"> UTC</label>
      </div>
      <p class="msg" id="msg"></p>
    </div>
  </details>

  <section class="passes" id="passes"></section>
</main>

<script>
(function () {
  'use strict';
  var R2D = 180 / Math.PI, D2R = Math.PI / 180;
  var KEY = 'passpredictor.v1';
  var $ = function (id) { return document.getElementById(id); };

  var els = {
    tle: $('tle'), satPick: $('satPick'), satPickWrap: $('satPickWrap'),
    lat: $('lat'), lon: $('lon'), alt: $('alt'), minEl: $('minEl'), hours: $('hours'),
    utc: $('utc'), run: $('run'), locate: $('locate'), pick: $('pick'), file: $('file'), msg: $('msg'), passes: $('passes'),
    hero: $('hero'), heroName: $('heroName'), heroAge: $('heroAge'), heroLead: $('heroLead'),
    heroBig: $('heroBig'), heroDetail: $('heroDetail'), heroNow: $('heroNow'),
    nowAz: $('nowAz'), nowEl: $('nowEl'), nowRange: $('nowRange'), nowSub: $('nowSub'),
    setup: $('setup'), setupSum: $('setupSum'), tzLabel: $('tzLabel')
  };

  var state = { sets: [], satrec: null, satName: '', obsGd: null, passes: [], minEl: 5, hours: 48, computedAt: 0 };

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        tle: els.tle.value, sat: els.satPick.value,
        lat: els.lat.value, lon: els.lon.value, alt: els.alt.value,
        minEl: els.minEl.value, hours: els.hours.value, utc: els.utc.checked
      }));
    } catch (e) { /* storage unavailable; page still works */ }
  }

  /* ---------- formatting ---------- */
  function tz() { return els.utc.checked ? 'UTC' : undefined; }
  function fmtTime(d) {
    return new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: tz() }).format(d);
  }
  function fmtHM(d) {
    return new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz() }).format(d);
  }
  function fmtDay(d) {
    return new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short', timeZone: tz() }).format(d);
  }
  function dayKey(d) {
    return new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: tz() }).format(d);
  }
  function fmtDur(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    if (m > 0) return m + 'm ' + String(sec).padStart(2, '0') + 's';
    return sec + 's';
  }
  function fmtDurShort(ms) {
    var s = Math.round(ms / 1000), m = Math.floor(s / 60), sec = s % 60;
    if (m >= 120) return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
    return m + ' min ' + sec + ' s';
  }
  function deg(x) { return Math.round(x) + '°'; }
  function tzName() {
    if (els.utc.checked) return 'UTC';
    try {
      var parts = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(new Date());
      var p = parts.find(function (x) { return x.type === 'timeZoneName'; });
      return p ? p.value : 'local';
    } catch (e) { return 'local'; }
  }

  /* ---------- TLE parsing ---------- */
  function parseTles(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.replace(/\s+$/, ''); }).filter(function (l) { return l.trim().length; });
    var sets = [];
    for (var i = 0; i < lines.length; i++) {
      var l1 = lines[i].trim();
      if (l1.indexOf('1 ') === 0 && i + 1 < lines.length && lines[i + 1].trim().indexOf('2 ') === 0) {
        var name = null;
        if (i > 0) {
          var prev = lines[i - 1].trim();
          if (prev.indexOf('1 ') !== 0 && prev.indexOf('2 ') !== 0) name = prev.replace(/^0 /, '');
        }
        if (!name) name = 'NORAD ' + l1.substring(2, 7).trim();
        sets.push({ name: name, l1: l1, l2: lines[i + 1].trim() });
        i++;
      }
    }
    return sets;
  }

  /* ---------- propagation ---------- */
  function lookAt(satrec, obsGd, date) {
    var pv = satellite.propagate(satrec, date);
    if (!pv || !pv.position || typeof pv.position !== 'object') return null;
    var gmst = satellite.gstime(date);
    var ecf = satellite.eciToEcf(pv.position, gmst);
    var la = satellite.ecfToLookAngles(obsGd, ecf);
    return {
      el: la.elevation * R2D,
      az: ((la.azimuth * R2D) % 360 + 360) % 360,
      range: la.rangeSat,
      eci: pv.position, gmst: gmst
    };
  }
  function elAt(satrec, obsGd, t) {
    var r = lookAt(satrec, obsGd, new Date(t));
    return r ? r.el : -90;
  }
  // bisection for the time el crosses minEl between a (before) and b (after)
  function refineCrossing(satrec, obsGd, a, b, minEl) {
    var fa = elAt(satrec, obsGd, a) - minEl;
    for (var i = 0; i < 20 && (b - a) > 250; i++) {
      var m = (a + b) / 2;
      var fm = elAt(satrec, obsGd, m) - minEl;
      if ((fm >= 0) === (fa >= 0)) { a = m; fa = fm; } else { b = m; }
    }
    return (a + b) / 2;
  }
  function buildPass(satrec, obsGd, aos, los, truncated) {
    var n = 60;
    var track = [], best = { el: -90, t: aos };
    for (var i = 0; i <= n; i++) {
      var t = aos + (los - aos) * i / n;
      var r = lookAt(satrec, obsGd, new Date(t));
      if (!r) continue;
      track.push({ az: r.az, el: r.el });
      if (r.el > best.el) best = { el: r.el, t: t, az: r.az };
    }
    // refine peak with a golden-section search around the best sample
    var dt = (los - aos) / n;
    var lo = Math.max(aos, best.t - dt), hi = Math.min(los, best.t + dt);
    var g = (Math.sqrt(5) - 1) / 2;
    var x1 = hi - g * (hi - lo), x2 = lo + g * (hi - lo);
    var f1 = elAt(satrec, obsGd, x1), f2 = elAt(satrec, obsGd, x2);
    for (var k = 0; k < 25 && (hi - lo) > 500; k++) {
      if (f1 < f2) { lo = x1; x1 = x2; f1 = f2; x2 = lo + g * (hi - lo); f2 = elAt(satrec, obsGd, x2); }
      else { hi = x2; x2 = x1; f2 = f1; x1 = hi - g * (hi - lo); f1 = elAt(satrec, obsGd, x1); }
    }
    var peakT = (lo + hi) / 2;
    var peak = lookAt(satrec, obsGd, new Date(peakT));
    var a = lookAt(satrec, obsGd, new Date(aos)), l = lookAt(satrec, obsGd, new Date(los));
    return {
      aos: aos, los: los, truncated: !!truncated,
      aosAz: a ? a.az : 0, losAz: l ? l.az : 0,
      maxEl: peak ? peak.el : best.el, maxT: peakT, maxAz: peak ? peak.az : best.az,
      track: track
    };
  }
  function findPasses(satrec, obsGd, start, hours, minEl) {
    var end = start + hours * 3600e3;
    var periodMin = (2 * Math.PI) / satrec.no;  // satrec.no is rad/min
    var step = periodMin > 1000 ? 300e3 : periodMin > 200 ? 120e3 : 30e3;
    var passes = [];
    var t = start;
    var el = elAt(satrec, obsGd, t);
    var inPass = el >= minEl;
    var aos = inPass ? start : null;
    var cont = inPass;
    while (t < end && passes.length < 400) {
      var t2 = Math.min(t + step, end);
      var el2 = elAt(satrec, obsGd, t2);
      if (!inPass && el2 >= minEl) {
        aos = refineCrossing(satrec, obsGd, t, t2, minEl);
        inPass = true;
      } else if (inPass && el2 < minEl) {
        var los = refineCrossing(satrec, obsGd, t, t2, minEl);
        passes.push(buildPass(satrec, obsGd, aos, los, false));
        inPass = false;
      }
      t = t2; el = el2;
    }
    if (inPass && aos !== null) passes.push(buildPass(satrec, obsGd, aos, end, true));
    if (cont && passes.length) passes[0].continuedFromStart = true;
    return passes;
  }

  /* ---------- sky plot ---------- */
  function skyPlot(p) {
    var cx = 32, cy = 32, R = 28;
    function pt(az, el) {
      var r = R * (90 - Math.max(0, el)) / 90;
      var a = az * D2R;
      return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    }
    var d = '';
    p.track.forEach(function (q, i) {
      var xy = pt(q.az, q.el);
      d += (i ? 'L' : 'M') + xy[0].toFixed(1) + ' ' + xy[1].toFixed(1);
    });
    var a0 = pt(p.aosAz, 0);
    return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
      '<circle class="ring" cx="32" cy="32" r="28"/>' +
      '<circle class="ring" cx="32" cy="32" r="18.7"/>' +
      '<circle class="ring" cx="32" cy="32" r="9.3"/>' +
      '<line class="cross" x1="32" y1="4" x2="32" y2="60"/><line class="cross" x1="4" y1="32" x2="60" y2="32"/>' +
      '<text class="n" x="32" y="7" text-anchor="middle">N</text>' +
      '<path class="track" d="' + d + '"/>' +
      '<circle class="aos" cx="' + a0[0].toFixed(1) + '" cy="' + a0[1].toFixed(1) + '" r="2.4"/>' +
      '</svg>';
  }

  /* ---------- rendering ---------- */
  function renderPasses() {
    var now = Date.now();
    var live = state.passes.filter(function (p) { return p.los > now; });
    var html = '';
    if (!state.satrec) { els.passes.innerHTML = ''; return; }
    if (!live.length) {
      els.passes.innerHTML = '<p class="none">No passes above ' + state.minEl + '° in the next ' + state.hours + ' hours.</p>';
      return;
    }
    var lastDay = '', firstUpcoming = true;
    live.forEach(function (p) {
      var dk = dayKey(new Date(p.aos));
      if (dk !== lastDay) { html += '<h2>' + fmtDay(new Date(p.aos)) + '</h2>'; lastDay = dk; }
      var isLive = p.aos <= now;
      var cls = 'pass' + (isLive ? ' live' : (firstUpcoming ? ' next' : ''));
      if (!isLive) firstUpcoming = false;
      var aosTxt = p.continuedFromStart ? 'now' : fmtTime(new Date(p.aos));
      var losTxt = p.truncated ? 'beyond window' : fmtTime(new Date(p.los));
      html += '<div class="' + cls + '">' +
        '<div>' +
          '<div class="times">' + aosTxt + '<span class="sep">→</span>' + losTxt + '</div>' +
          '<div class="peak">peaks <b>' + deg(p.maxEl) + '</b> at ' + fmtHM(new Date(p.maxT)) + ', azimuth ' + deg(p.maxAz) + '</div>' +
          '<div class="meta">rises ' + deg(p.aosAz) + ', sets ' + deg(p.losAz) + ', ' + fmtDurShort(p.los - p.aos) + '</div>' +
        '</div>' +
        skyPlot(p) +
        '</div>';
    });
    els.passes.innerHTML = html;
  }

  function renderHero() {
    var now = Date.now();
    if (!state.satrec) return;
    var upcoming = state.passes.filter(function (p) { return p.los > now; });
    var cur = upcoming.length && upcoming[0].aos <= now ? upcoming[0] : null;
    var next = cur ? upcoming[1] : upcoming[0];

    els.hero.classList.remove('empty');
    els.heroName.textContent = state.satName;
    els.heroBig.classList.toggle('live', !!cur);

    if (cur) {
      els.heroLead.textContent = 'Above the horizon now';
      els.heroBig.textContent = cur.truncated ? 'in view' : 'sets in ' + fmtDur(cur.los - now);
      els.heroDetail.textContent = cur.truncated
        ? 'Still above ' + state.minEl + '° at the end of the window.'
        : 'Sets ' + fmtTime(new Date(cur.los)) + ' toward ' + deg(cur.losAz) +
          (next ? '. Next pass ' + fmtHM(new Date(next.aos)) + '.' : '.');
    } else if (next) {
      els.heroLead.textContent = 'Next pass in';
      els.heroBig.textContent = fmtDur(next.aos - now);
      els.heroDetail.textContent = fmtTime(new Date(next.aos)) + ' from ' + deg(next.aosAz) +
        ', peaks ' + deg(next.maxEl) + ' at ' + fmtHM(new Date(next.maxT)) + ', ' + fmtDurShort(next.los - next.aos) + '.';
    } else {
      els.heroLead.textContent = 'Nothing scheduled';
      els.heroBig.textContent = 'no passes';
      els.heroDetail.textContent = 'None above ' + state.minEl + '° in the next ' + state.hours + ' hours. Try a lower minimum elevation or a longer window.';
    }

    var r = lookAt(state.satrec, state.obsGd, new Date(now));
    if (r) {
      els.heroNow.hidden = false;
      els.nowAz.textContent = r.az.toFixed(1) + '°';
      els.nowEl.textContent = r.el.toFixed(1) + '°';
      els.nowRange.textContent = Math.round(r.range).toLocaleString() + ' km';
      var gd = satellite.eciToGeodetic(r.eci, r.gmst);
      els.nowSub.textContent = (gd.latitude * R2D).toFixed(1) + ', ' + (gd.longitude * R2D).toFixed(1);
    } else {
      els.heroNow.hidden = true;
    }
  }

  function renderAge() {
    if (!state.satrec) { els.heroAge.textContent = ''; return; }
    var epochMs = (state.satrec.jdsatepoch - 2440587.5) * 86400e3;
    var days = (Date.now() - epochMs) / 86400e3;
    var txt = days < 0 ? 'epoch in future' : 'epoch ' + (days < 1 ? Math.round(days * 24) + ' h' : days.toFixed(1) + ' d') + ' old';
    els.heroAge.textContent = txt;
    els.heroAge.classList.toggle('old', days > 7 || days < -1);
  }

  function renderSummary() {
    if (!state.satrec) { els.setupSum.textContent = ''; return; }
    els.setupSum.textContent = els.lat.value + ', ' + els.lon.value + ' · ≥' + state.minEl + '° · ' + state.hours + ' h';
  }

  function setMsg(text, isErr) {
    els.msg.textContent = text || '';
    els.msg.classList.toggle('err', !!isErr);
  }

  function parseCoord(v) {
    if (v == null) return NaN;
    var t = String(v).trim().toUpperCase().replace(/[°,]/g, ' ').replace(/\s+/g, ' ');
    if (!t) return NaN;
    var sign = 1;
    if (/[SW]/.test(t)) sign = -1;
    t = t.replace(/[NSEW]/g, '').trim();
    var n = parseFloat(t);
    if (isNaN(n)) return NaN;
    return n * sign;
  }

  /* ---------- main compute ---------- */
  function syncSatPicker() {
    state.sets = parseTles(els.tle.value);
    var keep = els.satPick.value;
    els.satPick.innerHTML = '';
    state.sets.forEach(function (s, i) {
      var o = document.createElement('option');
      o.value = String(i); o.textContent = s.name;
      els.satPick.appendChild(o);
    });
    if (keep && Number(keep) < state.sets.length) els.satPick.value = keep;
    els.satPickWrap.hidden = state.sets.length < 2;
  }

  function compute() {
    if (typeof satellite === 'undefined') {
      setMsg('The propagation library did not load. Check your connection and reload.', true);
      return;
    }
    syncSatPicker();
    if (!state.sets.length) { setMsg('No valid TLE found. Paste line 1 and line 2 (a name line above them is optional).', true); return; }
    var lat = parseCoord(els.lat.value), lon = parseCoord(els.lon.value), alt = parseFloat(String(els.alt.value).replace(/[^\d.\-]/g, '')) || 0;
    if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { setMsg('Enter a latitude between −90 and 90 and a longitude between −180 and 180.', true); return; }
    var minEl = parseFloat(els.minEl.value); if (isNaN(minEl)) minEl = 5;
    var hours = parseFloat(els.hours.value); if (isNaN(hours) || hours < 1) hours = 48; if (hours > 336) hours = 336;
    els.minEl.value = minEl; els.hours.value = hours;

    var set = state.sets[Number(els.satPick.value) || 0];
    var satrec;
    try { satrec = satellite.twoline2satrec(set.l1, set.l2); } catch (e) { satrec = null; }
    if (!satrec || satrec.error) { setMsg('That TLE could not be parsed. Check for line breaks inside the element lines.', true); return; }

    state.satrec = satrec; state.satName = set.name;
    state.obsGd = { latitude: lat * D2R, longitude: lon * D2R, height: alt / 1000 };
    state.minEl = minEl; state.hours = hours;

    var start = Date.now();
    try {
      state.passes = findPasses(satrec, state.obsGd, start, hours, minEl);
    } catch (e) {
      setMsg('Propagation failed for this TLE. It may have decayed or the elements may be corrupt.', true);
      state.passes = [];
    }
    state.computedAt = start;
    setMsg(state.passes.length + (state.passes.length === 1 ? ' pass' : ' passes') + ' found. Times in ' + tzName() + '.');
    save();
    renderAge(); renderSummary(); renderPasses(); renderHero();
    if (state.passes.length) els.setup.open = false;
  }

  /* ---------- events ---------- */
  els.run.addEventListener('click', compute);
  els.tle.addEventListener('input', syncSatPicker);
  els.utc.addEventListener('change', function () {
    els.tzLabel.textContent = tzName();
    save(); renderPasses(); renderHero();
    if (state.satrec) setMsg('Times in ' + tzName() + '.');
  });
  els.pick.addEventListener('click', function () { els.file.value = ''; els.file.click(); });
  els.file.addEventListener('change', function () {
    var f = els.file.files && els.file.files[0];
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) { setMsg('That file is over 2 MB. Trim it to the satellites you need.', true); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '');
      var sets = parseTles(text);
      if (!sets.length) { setMsg('No TLE sets found in ' + f.name + '.', true); return; }
      els.tle.value = text;
      els.satPick.value = '';
      syncSatPicker();
      setMsg('Loaded ' + sets.length + (sets.length === 1 ? ' satellite' : ' satellites') + ' from ' + f.name + (sets.length > 1 ? '. Pick one, then compute.' : '.'));
      els.setup.open = true;
      if (sets.length > 1) els.satPick.focus();
    };
    reader.onerror = function () { setMsg('Could not read ' + f.name + '.', true); };
    reader.readAsText(f);
  });
  els.locate.addEventListener('click', function () {
    if (!navigator.geolocation) { setMsg('Location is not available in this browser. Enter coordinates by hand.', true); return; }
    setMsg('Getting location…');
    try {
      navigator.geolocation.getCurrentPosition(function (pos) {
        els.lat.value = pos.coords.latitude.toFixed(4);
        els.lon.value = pos.coords.longitude.toFixed(4);
        if (pos.coords.altitude != null && !isNaN(pos.coords.altitude)) els.alt.value = Math.round(pos.coords.altitude);
        setMsg('Location set to ' + els.lat.value + ', ' + els.lon.value + '.');
        save();
      }, function (err) {
        setMsg('Location was not granted (' + (err && err.message ? err.message : 'blocked') + '). Enter coordinates by hand.', true);
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    } catch (e) {
      setMsg('Location is not available here. Enter coordinates by hand.', true);
    }
  });

  // live clock: countdown every second; drop passes as they end; recompute quietly when the window is mostly consumed
  setInterval(function () {
    if (!state.satrec) return;
    renderHero();
    var now = Date.now();
    var firstLos = state.passes.length ? state.passes[0].los : 0;
    if (firstLos && firstLos <= now) {
      state.passes = state.passes.filter(function (p) { return p.los > now; });
      renderPasses();
    }
    if (now - state.computedAt > state.hours * 3600e3 * 0.5) compute();
  }, 1000);

  /* ---------- init ---------- */
  els.tzLabel.textContent = tzName();
  var saved = load();
  if (saved) {
    els.tle.value = saved.tle || '';
    els.lat.value = saved.lat || ''; els.lon.value = saved.lon || ''; els.alt.value = saved.alt || '';
    if (saved.minEl) els.minEl.value = saved.minEl;
    if (saved.hours) els.hours.value = saved.hours;
    els.utc.checked = !!saved.utc;
    els.tzLabel.textContent = tzName();
    syncSatPicker();
    if (saved.sat && Number(saved.sat) < state.sets.length) els.satPick.value = saved.sat;
    if (state.sets.length && els.lat.value !== '' && els.lon.value !== '') compute();
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
